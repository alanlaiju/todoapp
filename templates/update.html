{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

    <div class="container">

        <div class="todo-card">

            <h1>My Todo List</h1>
            <p class="subtitle">Manage your daily tasks efficiently</p>

            <form method="POST" class="todo-form">
                {% csrf_token %}

                <input type="text" name="task-name" placeholder="Enter task name" required>

                <input type="date" name="task-date" required>

                <button type="submit">Add Task</button>

            </form>

        </div>

        <div class="tasks-container">

            {% for i in item %}

            <div class="task-item">

                <div class="task-details">
                    <h3>{{ i.taskname }}</h3>
                    <p>📅 {{ i.taskdate }}</p>
                </div>

                <div class="task-actions">

                    <!-- UPDATE BUTTON -->
                    <form action="{% url 'update' i.id %}" method="GET">
                        <button type="submit" class="update-btn">
                            Update
                        </button>
                    </form>

                    <!-- DELETE BUTTON -->
                    <form action="{% url 'delete' i.id %}" method="POST">
                        {% csrf_token %}
                        <button type="submit" class="delete-btn">
                            Delete
                        </button>
                    </form>

                </div>

            </div>

            {% empty %}

            <div class="empty-state">
                <p>No tasks available. Add your first task!</p>
            </div>

            {% endfor %}

        </div>

    </div>

</body>
</html>
